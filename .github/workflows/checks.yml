name: Checks

# Lint, typecheck, test and build both workspaces on every pull request and
# every push to main, plus a dependency audit. Typecheck runs alongside the
# build because the build configs exclude test files and scripts; the
# typecheck step is what covers them.

on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same pull request is wasted minutes. Never cancelled
# on `main`, where each commit's result is a record worth keeping.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      # Both report, always: failing fast would hide a server fault behind a
      # frontend one.
      fail-fast: false
      matrix:
        workspace: [frontend, server]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          # One Node version everywhere: `.nvmrc`, the Dockerfile and Render.
          node-version-file: .nvmrc
          cache: npm

      # The root install, because this is an npm workspace: installing inside
      # one workspace alone leaves the hoisted dependencies out.
      - name: Install
        run: npm ci

      - name: Lint (frontend)
        if: matrix.workspace == 'frontend'
        run: npm run lint -w apps/frontend

      - name: Lint (server)
        if: matrix.workspace == 'server'
        run: npm run lint:server

      - name: Typecheck (frontend)
        if: matrix.workspace == 'frontend'
        working-directory: apps/frontend
        run: npx tsc -b --pretty false

      # Source, tests, maintenance scripts and tool config, with the module
      # resolution Vitest and tsx use. The build below checks the shipped
      # source again under the production config.
      - name: Typecheck (server)
        if: matrix.workspace == 'server'
        working-directory: apps/server
        run: npx tsc -p tsconfig.check.json --pretty false

      - name: Test
        working-directory: apps/${{ matrix.workspace }}
        run: npm test

      - name: Build
        working-directory: apps/${{ matrix.workspace }}
        run: npm run build

      # Fails if the dashboard's entry chunk statically imports board-only code.
      - name: Check bundle
        if: matrix.workspace == 'frontend'
        working-directory: apps/frontend
        run: node scripts/check-bundle.mjs

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Runtime dependencies only, and only what is worth failing a build
      # over. Dependabot (.github/dependabot.yml) raises the fixes.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
