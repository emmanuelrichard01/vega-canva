name: Database backup

# Neon's Free plan history window is 6 hours, capped at 1 GB of change
# history. That is a good first line -- restoring from it is instant and needs
# no tooling -- but a bad write found the next morning is outside it, and so
# is anything discovered on a Monday. It is also the same account: losing the
# Neon login loses the database and its history together, because they were
# never two things.
#
# This is the second copy. Different vendor, retention you choose.
#
# Runs on GitHub Actions because it is the only free scheduler already
# attached to this repository, and the job is one minute of one runner a day.

on:
  schedule:
    # 03:17 UTC. Off the hour deliberately: every scheduler on the platform is
    # busiest exactly on it, and GitHub delays cron jobs under load.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dump and verify, but do not upload'
        type: boolean
        default: false

# Never let two backups overlap; a slow one should delay the next, not race it.
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install a Postgres client that matches the server
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        # `pg_dump` refuses to dump a server newer than itself, so this has to
        # track the server rather than a number somebody typed once.
        #
        # It was pinned to a major on the reasoning that a mismatch should be a
        # deliberate edit rather than a surprise. The surprise arrived anyway:
        # Neon upgraded to 18, the pin said 17, and every nightly run failed --
        # silently, because a backup nobody is watching only announces itself
        # when it is needed. Worse, the pin was not even in force: the runner
        # ships a PGDG client 16 at /usr/bin/pg_dump, and installing 17
        # alongside it does not move that symlink, so the dump was being
        # attempted with 16 the whole time.
        #
        # So: ask the server what it is, install that major, and put it first
        # on PATH. `psql` is used for the question because only `pg_dump` is
        # strict about versions -- psql connects to anything.
        run: |
          set -euo pipefail

          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq

          if ! command -v psql >/dev/null; then
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi

          MAJOR="$(psql "$BACKUP_DATABASE_URL" -tAc 'SHOW server_version' | cut -d. -f1 | tr -dc '0-9')"
          if [ -z "$MAJOR" ]; then
            echo "Could not read the server version. Is BACKUP_DATABASE_URL set and reachable?" >&2
            exit 1
          fi
          echo "Server is PostgreSQL $MAJOR; installing the matching client."

          sudo apt-get install -y --no-install-recommends "postgresql-client-${MAJOR}"

          # Ahead of the runner's own client, which is what the old step failed
          # to do. `$GITHUB_PATH` applies to every later step, including the
          # dump itself.
          echo "/usr/lib/postgresql/${MAJOR}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${MAJOR}/bin:$PATH"

          CLIENT="$(pg_dump --version | tr -dc '0-9. ' | awk '{print $NF}' | cut -d. -f1)"
          echo "pg_dump is $(pg_dump --version)"
          if [ "$CLIENT" -lt "$MAJOR" ]; then
            echo "pg_dump ${CLIENT} cannot dump a PostgreSQL ${MAJOR} server." >&2
            exit 1
          fi

      - name: Back up
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # R2 ignores the region but the AWS SDK insists on one.
          AWS_DEFAULT_REGION: auto
          # R2 does not implement the integrity headers the v2 CLI now sends
          # by default; without these, uploads fail on a checksum the other
          # end never agreed to compute.
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          ./apps/server/scripts/backup-db.sh --keep 30 \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Say so loudly if it failed
        if: failure()
        run: |
          echo "::error title=Database backup failed::The nightly backup did not complete. \
          Until it does, recovery is limited to Neon's 6-hour history window."
