<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 2.2KB, generated from the logomark. This replaced a 762KB
         `/favicon.svg` — a print-scale asset shipped to draw 16 pixels. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vega Studio</title>
    <!-- Board faces, and only the ones that are not already in the bundle.

         This asked for eleven families. Six of them -- Inter, Roboto, Space
         Grotesk, Outfit, Caveat and Architects Daughter -- are self-hosted
         through `@fontsource` and imported at the top of `index.css`, so every
         one of those was being fetched twice: once from our own origin, and
         again from a third party on the critical path. An earlier pass caught
         this for Inter and wrote "Caveat only" in a comment here; the request
         underneath the comment still named all eleven.

         The five left are the ones nothing in the app bundles, and nothing in
         the *interface* renders either. They exist so that text on a board can
         be set in them, which is a choice somebody makes minutes after the
         page has painted, if ever.

         So it is loaded without blocking the render. `media="print"` does not
         match, so the browser fetches the stylesheet at a lower priority and
         does not hold first paint behind it; `onload` then flips it to `all`
         and the faces apply. Canvas text measured before they arrive is
         re-measured when they land -- that is what `engine/text/fontEpoch.ts`
         is for -- so arriving late is a repaint here rather than a wrong
         layout. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Nothing here any more, deliberately.

         Five board faces used to be fetched by a stylesheet on this line, so
         every visitor downloaded all five on every visit whether they set a
         word in them or not. That makes "add more fonts" a straight trade
         against load time, which is the wrong trade: most people use two, and
         the fortieth face on the list is the one nobody is waiting for.

         Board faces are fetched on first use now -- see
         `engine/text/fontCatalogue.ts`. The interface itself is set in Inter
         and Caveat, both bundled through `@fontsource` and compiled into the
         app's own CSS, so first paint depends on no network font at all.

         The preconnects stay: they cost two idle sockets and remove a DNS and
         TLS round trip from the first font a person actually chooses. -->
  </head>
  <body>
    <!-- The boot shell.

         Two problems, both of which happen before a single line of our own
         JavaScript has run.

         The first is the colour. The theme lives in `localStorage` and is
         applied by React, which means a person who chose dark spent the whole
         module download looking at a white page and then had it snap to black
         under them. The script below is deliberately synchronous and in the
         `<body>`: it has to paint the right ground the first time, and there
         is no first paint to be blocked before.

         The second is the wait itself. `#root` was simply empty, so a slow
         connection showed nothing at all and gave no sign the page was
         working. What is *not* wanted is a spinner on a fast connection --
         a loader that flashes for eighty milliseconds reads as jank and makes
         the app feel slower than showing nothing would have. So the mark below
         is transparent, and an `animation-delay` fades it in only if boot is
         still going after 320ms. On a warm load nobody ever sees it, and no
         JavaScript is involved in deciding that.

         React clears `#root` when it mounts, so this removes itself. -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem('vega_dark_theme') === 'true';
          if (dark) document.body.classList.add('dark-theme');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* Private mode, or storage disabled. Light is the default anyway. */
        }
      })();
    </script>
    <style>
      /* Inline, and only these. The stylesheet this page needs is a module
         import, so it arrives with the bundle -- too late to be what the first
         frame is painted with. */
      body { margin: 0; background: #FFFFFF; }
      body.dark-theme { background: #18181B; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot i {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: #F3A024;
        opacity: 0;
        animation: bootIn 260ms ease-out 320ms forwards, bootPulse 1.6s ease-in-out 580ms infinite;
      }
      @keyframes bootIn { to { opacity: 1; } }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.86); opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i { animation: bootIn 260ms ease-out 320ms forwards; }
      }
    </style>
    <div id="root">
      <div id="boot" aria-hidden="true"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
