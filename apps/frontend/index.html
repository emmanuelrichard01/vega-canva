<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vega Studio — The real-time whiteboard for thinking together</title>
    <meta name="description" content="Draw, diagram and decide together on one infinite board. Sticky notes, flowcharts, code, charts and voice notes, live with your team — and it works offline." />
    <meta name="application-name" content="Vega Studio" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181B" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Icons, all drawn from the vector mark by
         `apps/server/scripts/brand-assets.ts`.

         SVG first: it is one request at every density, and it carries its own
         dark-mode tile so the mark keeps an edge on a dark tab strip. The ICO
         is for everything that ignores SVG favicons, the 96px PNG is the size
         Google shows beside a search result, and the touch icon is opaque
         because iOS paints transparency black. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Vega" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- How a link to the site looks when it is shared.

         Board links get their own card — the board's name and a picture of
         it — from `api/share.ts`, which answers link unfurlers directly; see
         `vercel.json`. Everything else, starting with the home page, is this. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vega Studio" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Vega Studio — The real-time whiteboard for thinking together" />
    <meta property="og:description" content="Diagrams, sticky notes, code, charts and voice notes on one infinite board, live with your team. Works offline. No account needed." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vega Studio: a board with a flowchart, sticky notes, a code block and a chart, with two collaborators' cursors on it." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vega Studio — The real-time whiteboard for thinking together" />
    <meta name="twitter:description" content="Diagrams, sticky notes, code, charts and voice notes on one infinite board, live with your team. Works offline." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Vega Studio: a board with a flowchart, sticky notes, a code block and a chart." />

    <!-- What search engines can read without running the app.

         Only facts: the product is a web app, it is free to use, it runs in a
         browser, and these are its features. No ratings, no review counts and no
         organisation details, because there are none to cite — structured data
         that invents them is the fastest way to lose rich results altogether. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Vega Studio",
            "alternateName": "Vega",
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "@id": "%SITE_URL%/#app",
            "name": "Vega Studio",
            "url": "%SITE_URL%/",
            "image": "%SITE_URL%/og-image.png",
            "applicationCategory": "DesignApplication",
            "applicationSubCategory": "Collaborative whiteboard",
            "operatingSystem": "Any (web browser)",
            "browserRequirements": "Requires JavaScript and a modern browser.",
            "isAccessibleForFree": true,
            "description": "A real-time collaborative whiteboard: an infinite canvas for sticky notes, flowcharts, code blocks, charts, tables and voice notes, with live cursors, comments, time travel and offline editing.",
            "featureList": [
              "Real-time collaboration with live cursors and presence",
              "Sticky notes, shapes, connectors and flowcharts",
              "Code blocks with syntax highlighting",
              "Link cards and embedded videos and designs",
              "Charts and tables with formulas",
              "Voice notes and threaded comments",
              "Offline editing that merges when you reconnect",
              "Export to PNG, SVG, PDF and JSON"
            ],
            "isPartOf": { "@id": "%SITE_URL%/#website" }
          }
        ]
      }
    </script>
    <!--
      Zoom stays available.

      `maximum-scale=1, user-scalable=no` was added to stop double-tap zoom on
      the board, and it is both the wrong tool and unnecessary: the canvas
      already declares `touch-action: none` and the body `pan-x pan-y`, which
      routes gestures per element instead of taking them away from the whole
      document. What the flag actually did was remove pinch-zoom from the
      panels, the dialogs and every piece of text in the app -- which is a
      WCAG 1.4.4 failure for anyone who needs to magnify, in exchange for
      behaviour the canvas had already handled. iOS has ignored it since 10
      for the same reason.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Board faces, and only the ones that are not already in the bundle.

         This asked for eleven families. Six of them -- Inter, Roboto, Space
         Grotesk, Outfit, Caveat and Architects Daughter -- are self-hosted
         through `@fontsource` and imported at the top of `index.css`, so every
         one of those was being fetched twice: once from our own origin, and
         again from a third party on the critical path. An earlier pass caught
         this for Inter and wrote "Caveat only" in a comment here; the request
         underneath the comment still named all eleven.

         The five left are the ones nothing in the app bundles, and nothing in
         the *interface* renders either. They exist so that text on a board can
         be set in them, which is a choice somebody makes minutes after the
         page has painted, if ever.

         So it is loaded without blocking the render. `media="print"` does not
         match, so the browser fetches the stylesheet at a lower priority and
         does not hold first paint behind it; `onload` then flips it to `all`
         and the faces apply. Canvas text measured before they arrive is
         re-measured when they land -- that is what `engine/text/fontEpoch.ts`
         is for -- so arriving late is a repaint here rather than a wrong
         layout. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Nothing here any more, deliberately.

         Five board faces used to be fetched by a stylesheet on this line, so
         every visitor downloaded all five on every visit whether they set a
         word in them or not. That makes "add more fonts" a straight trade
         against load time, which is the wrong trade: most people use two, and
         the fortieth face on the list is the one nobody is waiting for.

         Board faces are fetched on first use now -- see
         `engine/text/fontCatalogue.ts`. The interface itself is set in Inter
         and Caveat, both bundled through `@fontsource` and compiled into the
         app's own CSS, so first paint depends on no network font at all.

         The preconnects stay: they cost two idle sockets and remove a DNS and
         TLS round trip from the first font a person actually chooses. -->
  </head>
  <body>
    <!-- The boot shell.

         Two problems, both of which happen before a single line of our own
         JavaScript has run.

         The first is the colour. The theme lives in `localStorage` and is
         applied by React, which means a person who chose dark spent the whole
         module download looking at a white page and then had it snap to black
         under them. The script below is deliberately synchronous and in the
         `<body>`: it has to paint the right ground the first time, and there
         is no first paint to be blocked before.

         The second is the wait itself. `#root` was simply empty, so a slow
         connection showed nothing at all and gave no sign the page was
         working. What is *not* wanted is a spinner on a fast connection --
         a loader that flashes for eighty milliseconds reads as jank and makes
         the app feel slower than showing nothing would have. So the mark below
         is transparent, and an `animation-delay` fades it in only if boot is
         still going after 320ms. On a warm load nobody ever sees it, and no
         JavaScript is involved in deciding that.

         React clears `#root` when it mounts, so this removes itself. -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem('vega_dark_theme') === 'true';
          if (dark) document.body.classList.add('dark-theme');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* Private mode, or storage disabled. Light is the default anyway. */
        }
      })();
    </script>
    <style>
      /* Inline, and only these. The stylesheet this page needs is a module
         import, so it arrives with the bundle -- too late to be what the first
         frame is painted with. */
      body { margin: 0; background: #FFFFFF; }
      body.dark-theme { background: #18181B; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot i {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: #F3A024;
        opacity: 0;
        animation: bootIn 260ms ease-out 320ms forwards, bootPulse 1.6s ease-in-out 580ms infinite;
      }
      @keyframes bootIn { to { opacity: 1; } }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.86); opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i { animation: bootIn 260ms ease-out 320ms forwards; }
      }
    </style>
    <div id="root">
      <div id="boot" aria-hidden="true"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
