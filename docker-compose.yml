# Local development only.
#
# Every credential below is published in this repository, the data stores are
# bound to the host, and there is no TLS anywhere. `docker-compose.prod.yml` is
# the deployable one; this is for running the thing on a laptop.
#
# The server refuses to start with these values when NODE_ENV=production, which
# is the safety net for the mistake this file makes easy.
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Explicitly not production: this is what allows the development defaults.
      - NODE_ENV=development
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      - db
      - minio

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: canva_user
      POSTGRES_PASSWORD: canva_password
      POSTGRES_DB: vega_canva
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: always
    environment:
      MINIO_ROOT_USER: canva_admin
      MINIO_ROOT_PASSWORD: canva_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
